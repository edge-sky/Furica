[package]
name = "furica-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Single-user loopback HTTP host for Furica"
license = "MIT"

[dependencies]
furica-core = { path = "../furica-core" }
furica-local = { path = "../furica-local", features = ["sensevoice"] }
furica-adapters = { path = "../furica-adapters", features = ["acp", "openai-compatible", "openai-responses", "anthropic", "aliyun", "volcengine"] }
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[lints.rust]
unsafe_code = "forbid"
