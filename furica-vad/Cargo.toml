[package]
name = "furica-vad"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Standalone local Silero VAD inference and speech boundary detection"
license = "MIT"
readme = "README.md"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
cpal = "=0.18.2"
ctrlc = { version = "3.5", features = ["termination"] }
rubato = { version = "=5.0.1", default-features = false }
rtrb = "0.3"

[lints.rust]
unsafe_code = "forbid"
