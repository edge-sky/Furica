[package]
name = "furica-web-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# An independent host: do not change the parent workspace or its lockfile.
[workspace]

[dependencies]
furica-core = { path = "../furica-core" }
furica-local = { path = "../furica-local", features = ["sensevoice"] }
furica-adapters = { path = "../furica-adapters", features = ["acp", "aliyun", "volcengine", "openai-compatible", "openai-responses", "anthropic"] }
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
hound = "3.5"

[lints.rust]
unsafe_code = "forbid"
